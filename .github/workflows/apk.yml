name: Compilar APK de Android

# Se ejecuta a mano (pestana Actions -> "Compilar APK de Android" ->
# Run workflow) o al publicar una etiqueta de version (v0.1.0, v0.2.0...).
# La primera compilacion tarda 30-60 min; las siguientes, menos, por la cache.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev libltdl-dev build-essential ccache

      # Sin "cython<3": python-for-android 2026 compila con su propio Cython.
      - name: Instalar buildozer
        run: pip install buildozer virtualenv setuptools

      - name: Copiar el codigo de procesamiento al paquete Android
        run: python android/preparar_fuente.py

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec', 'android/p4a-recipes/**') }}

      # El registro completo se guarda en android/build.log. Con "shell: bash"
      # el paso falla si buildozer falla, aunque la salida pase por tee.
      - name: Compilar APK
        id: compilar
        working-directory: android
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      # Solo si falla: muestra las lineas utiles del error, ya filtradas, en
      # lugar de obligar a buscar en un registro de decenas de miles de lineas.
      - name: Resumen del error
        if: failure()
        working-directory: android
        shell: bash
        run: |
          echo "=== Lineas con error (primeras 40) ==="
          grep -n "FAILED:\|error:\|Error:\|ERROR\|Command failed\|BUILD FAILED" build.log | head -40 || true
          echo
          echo "=== Ultimas 60 lineas utiles ==="
          grep -v "^\s*#\s*[A-Za-z_]* = '" build.log | tail -60 || true

      - name: Guardar registro completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-compilacion
          path: android/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: verificador-billetes-apk
          path: android/bin/*.apk